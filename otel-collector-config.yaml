receivers:
    otlp:
        protocols:
            grpc:
                endpoint: 0.0.0.0:4317

processors:
    batch:

exporters:
    debug:
    prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: default
    otlp:
        endpoint: jaeger:4317
        tls:
            insecure: true
        timeout: 10s
    # The contrib `loki` exporter was removed upstream; Loki 3.x ingests OTLP
    # natively at /otlp, to which otlphttp appends /v1/logs.
    otlphttp/loki:
        endpoint: "http://loki:3100/otlp"
        tls:
            insecure: true

extensions:
    health_check:
    pprof:
    zpages:

service:
    extensions: [health_check, pprof, zpages]
    pipelines:
        traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [debug, otlp]
        metrics:
            receivers: [otlp]
            processors: [batch]
            exporters: [debug, prometheus]
        logs:
            receivers: [otlp]
            processors: [batch]
            exporters: [debug, otlphttp/loki]
